name: Build and deploy jekyll site

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  jekyll:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # Jekyll 4.1 runs on Ruby 3.1. Bundler resolves the Gemfile afresh
    # each time, since Gemfile.lock is not committed.
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'
        bundler-cache: true
    - run: bundle exec jekyll build
      env:
        JEKYLL_ENV: production
    # Cloudflare Pages serves the prod branch.
    - uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: prod
        publish_dir: ./_site
